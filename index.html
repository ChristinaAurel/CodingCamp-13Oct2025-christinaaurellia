<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Todo List </title>

    <!--CSS External File-->
    <link rel="stylesheet" href="css\style.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="todo-container">
    <!-- Header Section -->
    <header>
        <h1 class="text-3xl font-bold"> My Todo List </h1>
    </header>

    <!-- Main Content Section -->
    <main>        
        <section class="todo-app my-4">
            <input type="text" class="text" id="todo-input" placeholder="Add a new task..."/>
            <input type="date" class="date" id="todo-date" placeholder="Select due date..."/>
            <select type="text" class="status" id="todo-status" placeholder="select task status"/>
                <option value="">Select status</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
        </section>

        <!-- Action Buttons Section -->
         <section class="justify-between mx-5 my-4">
            <button class="bg-blue-500 text-white rounded p-3" onclick="addTask();"> Add Task </button>
            <button class="bg-red-500 rounded p-3" onclick="deleteAllTasks();"> Delete All Tasks </button>
            <p class="m-2"></p>
            <button class="bg-blue-500 text-white rounded p-3" onclick="filterTasks();"> Filter Tasks (by Status)<span style="color:red">*</span></button>
            <select type="text" class="filter" id="filter-status">
                <option value="">Select status</option>
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <p style="color:red; font-size: small;">*click button to filter</p>
         </section>

         <section>
            <h2 class="text-2xl">List of Tasks</h2>
            <ul id="task-list">
                <!-- Task items will be dynamically added here -->
                 <li>No tasks added yet</li>
            </ul>
         </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p class="text-sn my-20"> &copy; 2025 Todo List App. All rights reserved. </p>
    </footer>
    </div>
    <!-- Javascript External File -->
    <script src="js\script.js"></script>
</body>
</html>
